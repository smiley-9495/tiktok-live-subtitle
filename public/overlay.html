<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자막 오버레이</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Noto Sans JP","Yu Gothic","Noto Sans SC","Microsoft YaHei",sans-serif}
#wrap{position:absolute;left:0;right:0;padding:2% 4%;text-align:center;opacity:1;
  -webkit-transition:opacity .25s;transition:opacity .25s}
#wrap.hide{opacity:0}
.row{margin:.1em 0}
.row.off{display:none}
.line{display:inline;padding:.04em .45em;border-radius:.25em;font-weight:700;line-height:1.55;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  text-shadow:0 2px 5px rgba(0,0,0,.85);word-break:keep-all;overflow-wrap:break-word}
.row.tr .line{font-size:.84em;font-weight:600}
</style>
</head>
<body>
<div id="wrap" class="hide"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var room = q.get("room") || "";
  var cfg = {
    size: +q.get("size") || 40,
    pos: q.get("pos") || "bottom",
    bgop: q.get("bgop") === null ? 55 : +q.get("bgop"),
    hold: +q.get("hold") || 5,
    lines: +q.get("lines") || 2,
    width: +q.get("width") || 90
  };

  var COLOR = { ko: "#ffffff", ja: "#ffe8a3", zh: "#c9f5c0", en: "#bfe3ff" };
  var LANG = { ko: "ko", ja: "ja", zh: "zh-CN", en: "en" };
  var ORDER = ["ko", "ja", "zh", "en"];

  var wrap = document.getElementById("wrap");
  var rows = {};
  ORDER.forEach(function (l) {
    var row = document.createElement("div");
    row.className = "row off" + (l === "ko" ? "" : " tr");
    var span = document.createElement("span");
    span.className = "line";
    span.lang = LANG[l];
    span.style.color = COLOR[l];
    row.appendChild(span);
    wrap.appendChild(row);
    rows[l] = { row: row, span: span };
  });

  function applyCfg() {
    wrap.style.fontSize = cfg.size + "px";
    var pad = Math.max(0, (100 - cfg.width) / 2);
    wrap.style.paddingLeft = wrap.style.paddingRight = pad + "%";
    wrap.style.top = wrap.style.bottom = "auto";
    wrap.style.webkitTransform = wrap.style.transform = "none";
    if (cfg.pos === "top") wrap.style.top = "0";
    else if (cfg.pos === "middle") { wrap.style.top = "50%"; wrap.style.webkitTransform = wrap.style.transform = "translateY(-50%)"; }
    else wrap.style.bottom = "0";
    ORDER.forEach(function (l) { rows[l].span.style.background = "rgba(0,0,0," + (cfg.bgop / 100) + ")"; });
  }
  applyCfg();

  var hideTimer = null, last = null;

  // 줄 수 제한: 넘치면 앞쪽(오래된 말)부터 잘라내 최신 내용만 남김
  function fit(l, text) {
    var span = rows[l].span;
    span.textContent = text;
    if (span.getClientRects().length <= cfg.lines) return;
    var cjk = (l === "ja" || l === "zh");
    var u = cjk ? Array.from(text) : text.split(" "), sep = cjk ? "" : " ";
    var lo = 0, hi = u.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      span.textContent = u.slice(mid).join(sep);
      if (span.getClientRects().length <= cfg.lines) hi = mid; else lo = mid + 1;
    }
    span.textContent = u.slice(lo).join(sep);
  }

  function render() {
    if (!last) return;
    var any = false;
    ORDER.forEach(function (l) {
      var t = last[l] || "";
      rows[l].row.className = "row" + (l === "ko" ? "" : " tr") + (t ? "" : " off");
      if (t) { fit(l, t); any = true; } else rows[l].span.textContent = "";
    });
    clearTimeout(hideTimer);
    if (any) {
      wrap.className = "";
      hideTimer = setTimeout(function () { wrap.className = "hide"; }, cfg.hold * 1000);
    } else {
      wrap.className = "hide";
    }
  }

  function apply(s) {
    if (s.cfg) {
      cfg.size = +s.cfg.size || cfg.size;
      cfg.pos = s.cfg.pos || cfg.pos;
      cfg.bgop = s.cfg.bgop === undefined ? cfg.bgop : +s.cfg.bgop;
      cfg.hold = +s.cfg.hold || cfg.hold;
      cfg.lines = +s.cfg.lines || cfg.lines;
      cfg.width = +s.cfg.width || cfg.width;
      applyCfg();
    }
    last = s;
    render();
  }

  var retry = 1000;
  function connect() {
    var ws;
    try {
      ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host +
        "/ws?role=view&room=" + encodeURIComponent(room));
    } catch (e) { setTimeout(connect, 3000); return; }
    var ping = null;
    ws.onopen = function () { retry = 1000; ping = setInterval(function () { try { ws.send("ping"); } catch (e) {} }, 30000); };
    ws.onmessage = function (ev) {
      if (ev.data === "pong") return;
      try { apply(JSON.parse(ev.data)); } catch (e) {}
    };
    ws.onclose = function () { clearInterval(ping); setTimeout(connect, retry); retry = Math.min(retry * 2, 10000); };
  }
  connect();
})();
</script>
</body>
</html>
