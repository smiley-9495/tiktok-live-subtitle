<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok LIVE 자막 오버레이</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,"Malgun Gothic",sans-serif}body{padding:18px;box-sizing:border-box;text-shadow:1px 2px 4px #000,0 0 2px #000;font-weight:800}#lines{min-height:100%;box-sizing:border-box;padding:4px;border-radius:8px;background:rgba(8,10,14,1)}.line{font-size:24px;line-height:1.45;overflow-wrap:anywhere;margin:3px 0}.tag{display:inline-block;min-width:54px;color:#baf7ff;font-size:.62em}.empty{font-size:14px;color:#ddd;text-shadow:none}
</style></head><body><div id="lines"><div class="empty">자막 연결 중…</div></div><script>
const labels={ko:'KO',en:'EN','zh-CN':'中文',ja:'日本語'};
let settings={transparency:0,langs:{ko:true,en:true,'zh-CN':true,ja:true},font:24};
let lines={}; let gotData=false; let socket=null; let retryTimer=null; let retryDelay=800;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const root=document.getElementById('lines');const transparency=Math.max(0,Math.min(100,Number(settings.transparency??0)));root.style.backgroundColor=`rgba(8,10,14,${1-transparency/100})`;const visible=Object.keys(labels).filter(k=>!settings.langs||settings.langs[k]!==false).map(k=>{const value=String(lines[k]||'').trim();return value?`<div class="line" style="font-size:${Math.max(12,Math.min(72,Number(settings.font)||24))}px"><span class="tag">${labels[k]}</span>${esc(value)}</div>`:''}).join('');if(visible){root.innerHTML=visible;}else if(!gotData){root.innerHTML='<div class="empty">실시간 자막 서버 연결 중…</div>';}else{root.innerHTML='<div class="empty">자막 입력 대기 중…</div>';}}
function receive(m){if(!m||m.channel!=='tiktok-live-subtitle-sync-v1')return;if(m.type==='settings'&&m.payload&&typeof m.payload==='object'){settings={...settings,...m.payload};gotData=true;render();}if(m.type==='lines'&&m.payload&&typeof m.payload==='object'){lines=m.payload;gotData=true;render();}}
function connect(){const room=new URLSearchParams(location.search).get('room');if(!room){document.getElementById('lines').innerHTML='<div class="empty">오버레이 링크에 room 코드가 없습니다. 사이트에서 링크를 다시 복사하세요.</div>';return;}const scheme=location.protocol==='https:'?'wss:':'ws:';try{socket=new WebSocket(`${scheme}//${location.host}/ws/${encodeURIComponent(room)}`);socket.onopen=()=>{retryDelay=800;};socket.onmessage=e=>{try{receive(JSON.parse(e.data));}catch(_){}};socket.onclose=()=>{clearTimeout(retryTimer);retryTimer=setTimeout(connect,retryDelay);retryDelay=Math.min(10000,retryDelay*1.7);};socket.onerror=()=>{try{socket.close();}catch(_){}};}catch(_){retryTimer=setTimeout(connect,2500);}}
window.addEventListener('message',e=>receive(e.data));
try{if('BroadcastChannel'in window){const channel=new BroadcastChannel('tiktok-live-subtitle-sync-v1');channel.onmessage=e=>receive(e.data);}}catch(_){}
render();connect();
</script></body></html>
